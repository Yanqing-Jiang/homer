# /Users/yj/homer/config/tmux-mini.conf
# Precondition: session homer-mini exists and is grouped with homer.

set-option -t homer-mini mouse on
set-option -t homer-mini status on
set-option -t homer-mini status-position top
set-option -t homer-mini status-interval 2
set-option -t homer-mini status-style 'bg=colour235,fg=colour250'

# Left: live tmux windows. Right: local actions.
# list markers keep the active window visible when the row is narrow.
# q/h escapes '#' as '##' so a window name containing '#[' cannot inject styles
# or click ranges into the rendered row (format_draw parses the expanded string).
set-option -t homer-mini status-format[0] '#[align=left list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} fg=colour250#,bg=colour235] #{q/h:window_name} #[norange],#[range=window|#{window_index} list=focus fg=black#,bg=colour39#,bold] #{q/h:window_name} #[norange]}#[nolist align=right]#[range=user|claude fg=colour214 bg=colour238 bold] Claude #[norange]#[default] #[range=user|codex fg=colour51 bg=colour238 bold] Codex #[norange]#[default] #[range=user|opencode fg=colour226 bg=colour238 bold] Opencode #[norange]#[default] #[range=user|kill fg=colour196 bg=colour238 bold] - #[norange]#[default] #[range=user|add fg=colour46 bg=colour238 bold] + #[norange]#[default]'

# One server-wide Status binding is unavoidable: bind-key has no session target.
# Every custom branch therefore requires session_name == homer-mini as well as
# the user range, so a future session that happens to render range=user|add,
# claude or codex cannot invoke Homer actions. The final branch is left exactly
# as tmux's stock click-to-select-window behavior.
#
# DEBT: the '%1' below is single-quoted for /bin/sh but not escaped, so a typed
# name containing a single quote closes the quote and the rest is executed as
# shell code (verified 2026-07-26). run-shell also format-expands its argument
# first, so a name containing #{...} is substituted before the helper's regex
# ever sees it (#(...) is substituted empty and does not spawn a job). Both are
# self-only: the prompt is reachable only from a local client on this
# single-user machine and reaches only the user's own shell. Upgrade to a
# quote-safe hand-off (set the name into a tmux user option, have the helper
# read it back) if this prompt is ever exposed beyond the local user.
bind-key -T root MouseDown1Status {
    if-shell -F '#{&&:#{==:#{session_name},homer-mini},#{==:#{mouse_status_range},add}}' {
        command-prompt -p 'New window name:' {
            run-shell "/Users/yj/homer/config/tmux-mini-newwin.sh '%1'"
        }
    } {
        if-shell -F '#{&&:#{==:#{session_name},homer-mini},#{==:#{mouse_status_range},kill}}' {
            if-shell -F '#{==:#{session_windows},1}' {
                display-message 'Refusing to kill the last window'
            } {
                confirm-before -p 'Kill window #W? (y/n)' kill-window
            }
        } {
        if-shell -F '#{&&:#{==:#{session_name},homer-mini},#{==:#{mouse_status_range},claude}}' {
            send-keys -l 'claude --dangerously-skip-permissions'
        } {
            if-shell -F '#{&&:#{==:#{session_name},homer-mini},#{==:#{mouse_status_range},codex}}' {
                send-keys -l 'codex -s danger-full-access'
            } {
            if-shell -F '#{&&:#{==:#{session_name},homer-mini},#{==:#{mouse_status_range},opencode}}' {
                send-keys -l 'opencode'
            } {
                switch-client -t =
            }
            }
        }
        }
    }
}

# Mouse-capable fallback menu: prefix + H.
# It is guarded so the global key binding cannot invoke local-only actions from
# the web's homer session. The menu pastes commands but does not press Enter.
# Its 'New window…' entry shares the DEBT noted above the root binding.
bind-key H {
    if-shell -F '#{==:#{session_name},homer-mini}' {
        display-menu -M -T 'Homer actions' -x C -y C \
            'New window…' n {
                command-prompt -p 'New window name:' {
                    run-shell "/Users/yj/homer/config/tmux-mini-newwin.sh '%1'"
                }
            } \
            '' \
            'Paste Claude' c {
                send-keys -l 'claude --dangerously-skip-permissions'
            } \
            'Paste Codex' x {
                send-keys -l 'codex -s danger-full-access'
            }
    } {
        display-message 'Homer actions are available in the homer-mini session'
    }
}
